name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catch Token Factory / PydanticAI drift

jobs:
  offline:
    name: tests against the mock (no secrets)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: |
          (uvicorn mock_server.server:app --port 8008 --log-level warning &) && sleep 2
          NEBIUS_BASE_URL=http://127.0.0.1:8008/v1/ NEBIUS_API_KEY=mock TRACE_EXPORTER=none nebius-agent verify --json reports/mock.json
      - uses: actions/upload-artifact@v4
        with: { name: conformance-mock-${{ matrix.python }}, path: reports/mock.json }

  token-factory:
    name: conformance against Token Factory (needs NEBIUS_API_KEY secret)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      NEBIUS_MODEL: ${{ vars.NEBIUS_MODEL || 'Qwen/Qwen3-235B-A22B-Instruct-2507' }}
      TRACE_EXPORTER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: skip without secret
        if: ${{ env.NEBIUS_API_KEY == '' }}
        run: echo "NEBIUS_API_KEY not set; skipping" && exit 0
      - name: conformance
        if: ${{ env.NEBIUS_API_KEY != '' }}
        run: nebius-agent verify --json "reports/$(echo "$NEBIUS_MODEL" | tr '/' '_').json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.NEBIUS_API_KEY != '' }}
        with: { name: conformance-token-factory, path: reports/*.json }
