[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-pydantic-ai-reference"
version = "0.1.0"
description = "Reference PydanticAI agent on Nebius Token Factory, plus a framework-agnostic conformance kit for partner integrations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic-ai-slim[openai]>=2.60,<3",
  "openai>=2,<4",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "daytona>=0.20",
  "cartesia>=2",
]

[project.optional-dependencies]
mock = []
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "matplotlib>=3.8"]  # matplotlib: the coding-session probe renders a chart when the sandbox runs locally
daytona = []

[project.scripts]
nebius-agent = "nebius_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nebius_agent*", "conformance*", "mock_server*"]

[tool.setuptools.package-data]
nebius_agent = ["static/*.html", "static/*.js", "probes/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
